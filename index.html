<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAN LAG</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0a0a09;--panel:#151513;--panel2:#1d1d1a;--line:#2e2d27;--sand:#d8bd82;--orange:#ff7a1a;--text:#d9d6cc;--mut:#8a8778;--ok:#4ade80;--warn:#facc15;--bad:#f87171}
  html{background:var(--bg)}
  body{background:transparent;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:17px;min-height:100vh}
  /* NỀN ẢNH: 3 ảnh bg1.jpg, bg2.jpg, bg3.jpg chuyển mờ liên tục (mỗi ảnh 8 giây) */
  #bg{position:fixed;inset:0;z-index:-1;background:#0a0a09}
  #bg i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:bgfade 24s infinite}
  #bg i:nth-child(1){background-image:url('bg1.jpg')}
  #bg i:nth-child(2){background-image:url('bg2.jpg');animation-delay:8s}
  #bg i:nth-child(3){background-image:url('bg3.jpg');animation-delay:16s}
  #bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,10,9,.72),rgba(10,10,9,.86))} /* độ phủ tối: tăng số để ảnh mờ hơn */
  @keyframes bgfade{0%{opacity:0}6%{opacity:1}33%{opacity:1}39%{opacity:0}100%{opacity:0}}
  .mono{font-family:'Share Tech Mono',monospace}
  .hud{background:rgba(36,36,30,.9);backdrop-filter:blur(3px);border:1px solid var(--line);position:relative;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
  .hud::before{content:"";position:absolute;left:0;top:0;width:34px;height:2px;background:var(--orange)}
  .hud h2,.hud h3{letter-spacing:.12em;text-transform:uppercase}
  .btn{font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.45rem .9rem;border:1px solid var(--sand);color:var(--sand);background:transparent;cursor:pointer;font-size:.85rem;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:.15s}
  .btn:hover{background:var(--sand);color:#111}
  .btn.pri{background:var(--orange);border-color:var(--orange);color:#111}
  .btn.pri:hover{background:#ff9347}
  .btn.ok{border-color:var(--ok);color:var(--ok)} .btn.ok:hover{background:var(--ok);color:#111}
  .btn.bad{border-color:var(--bad);color:var(--bad)} .btn.bad:hover{background:var(--bad);color:#111}
  .btn.sm{padding:.25rem .6rem;font-size:.75rem}
  .inp{width:100%;background:#0e0e0c;border:1px solid var(--line);color:var(--text);padding:.5rem .7rem;outline:none;font-family:inherit;font-size:1rem}
  .inp:focus{border-color:var(--orange)}
  label.lbl{display:block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:.25rem}
  .badge{display:inline-block;padding:.1rem .55rem;font-size:.72rem;font-weight:700;letter-spacing:.1em;border:1px solid}
  .badge.ok{color:var(--ok);border-color:var(--ok);background:rgba(74,222,128,.08)}
  .badge.warn{color:var(--warn);border-color:var(--warn);background:rgba(250,204,21,.08)}
  .badge.bad{color:var(--bad);border-color:var(--bad);background:rgba(248,113,113,.08)}
  .tab{padding:.6rem 1rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--orange);border-color:var(--orange)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:.6rem .7rem;border-bottom:1px solid var(--line)}
  td{padding:.6rem .7rem;border-bottom:1px solid rgba(46,45,39,.6);vertical-align:middle}
  tr:hover td{background:rgba(216,189,130,.03)}
  .scroll-x{overflow-x:auto}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
  .modal-bg > .hud{max-height:100%;overflow:auto;width:100%}
  #toast{position:fixed;bottom:1rem;right:1rem;z-index:60;display:flex;flex-direction:column;gap:.5rem}
  .toast{background:var(--panel2);border-left:3px solid var(--orange);padding:.6rem 1rem;max-width:320px}
  .toast.err{border-color:var(--bad)}
  .stat{font-size:2.2rem;font-weight:700;color:var(--sand);line-height:1}

  /* ===== Giải đấu ===== */
  .badge.mut{color:var(--mut);border-color:var(--line);background:transparent}
  .badge.info{color:#7dd3fc;border-color:#7dd3fc;background:rgba(125,211,252,.08)}
  a.btn{display:inline-block;text-decoration:none}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{background:transparent;color:var(--sand)}
  .btn.pri:disabled:hover{background:var(--orange);color:#111}
  .logo-mark{background:var(--orange);color:#111;font-weight:700;letter-spacing:.12em;padding:.35rem .7rem;font-size:1.3rem;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  .toplink{cursor:pointer;color:var(--sand);letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-size:.85rem}
  .toplink:hover{color:var(--orange)}
  .chip{padding:.4rem .9rem;border:1px solid var(--line);color:var(--mut);cursor:pointer;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;white-space:nowrap;background:rgba(10,10,9,.6)}
  .chip:hover{border-color:var(--sand);color:var(--sand)}
  .chip.on{color:#111;background:var(--orange);border-color:var(--orange)}
  .hud.hero{padding:0;background-image:linear-gradient(90deg,rgba(8,10,10,.93) 0%,rgba(8,10,10,.72) 55%,rgba(8,10,10,.38) 100%),var(--banner);background-size:cover;background-position:center right}
  .hero-in{padding:1.4rem}
  @media(min-width:768px){.hero-in{padding:2.4rem}}
  .hero-title{font-size:clamp(1.9rem,5vw,3.3rem);font-weight:700;letter-spacing:.08em;color:var(--sand);line-height:1.05;text-transform:uppercase;margin:.2rem 0 .4rem}
  .tile{border:1px solid var(--line);background:rgba(10,10,9,.62);padding:.6rem .8rem}
  .bar{height:6px;background:#0e0e0c;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:var(--orange)}
  .mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(10,10,9,.6);padding:1rem;cursor:pointer;transition:.15s;color:inherit}
  .mode:hover{border-color:var(--sand)}
  .mode.on{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
  details.acc>summary{cursor:pointer;list-style:none;padding:.9rem 1.1rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sand)}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::after{content:"+";float:right;color:var(--orange)}
  details.acc[open]>summary::after{content:"–"}
  details.acc .acc-body{padding:0 1.1rem 1.1rem}
  details.faq{margin-bottom:.7rem}
  details.faq>summary{cursor:pointer;font-weight:700;color:var(--text)}
  .stp{padding:.25rem .7rem;border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
  .stp.on{border-color:var(--orange);color:var(--orange)}
  .stp.done{border-color:var(--ok);color:var(--ok)}
  .inp.err{border-color:var(--bad)}
  .ferr{color:var(--bad);font-size:.8rem;margin-top:.2rem}
  textarea.inp{resize:vertical}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>
<div id="app"></div>
<script src="config.js"></script>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================================================
   CẤU HÌNH — nằm trong file config.js (cùng thư mục). Lấy 2 giá trị ở Supabase > Project Settings > API
   Để trống = chạy CHẾ ĐỘ DEMO (dữ liệu lưu trong trình duyệt)
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: (window.CONFIG && window.CONFIG.SUPABASE_URL) || 'https://ptzlvtfuhxxafjaehlwt.supabase.co',
  SUPABASE_ANON_KEY: (window.CONFIG && window.CONFIG.SUPABASE_ANON_KEY) || 'sb_publishable_u2K8IAzwJ2keXmuYQ3TB_A_8prNMApp'
};  // khóa publishable là khóa công khai, an toàn khi để trong mã nguồn; TUYỆT ĐỐI không dán khóa secret/service_role

const DEMO = (window.CONFIG && window.CONFIG.DEMO === true) || !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const sb = DEMO ? null : supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* ---------- Tiện ích ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('vi-VN') + 'đ';
const ST = { paid:['ĐÃ ĐÓNG','ok'], pending:['CHỜ DUYỆT','warn'], unpaid:['CHƯA ĐÓNG','bad'] };
const ROLE = { leader:'Leader', captain:'Captain', member:'Member' };
const badge = s => `<span class="badge ${ST[s][1]}">${ST[s][0]}</span>`;
function toast(msg, err){
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
const must = r => { if (r.error) throw r.error; return r.data; };
const fileToDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
const isAdmin = () => S.me && ['leader','captain'].includes(S.me.role);
const isLeader = () => S.me && S.me.role === 'leader';
// Captain chỉ được thêm/sửa/xóa thành viên có chức vụ "member"; Leader làm được tất cả
const canManage = m => isLeader() || (isAdmin() && m.role === 'member');

/* ---------- Trạng thái ---------- */
const S = { user:null, me:null, view:'dash', members:[], periods:[], periodId:null, payments:[], settings:{}, demoRole:'leader' };

/* ============================================================
   LỚP DỮ LIỆU — DEMO (localStorage)
   ============================================================ */
const DKEY = 'clan_hq_demo_v1';
function demoLoad(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DKEY)); } catch(e){}
  if (!d){
    const names = [['Viper','leader','Diamond','Rusher'],['Ghost','captain','Platinum','Sniper'],['Raven','member','Platinum','Support'],['Mamba','member','Gold','Looter'],['Falcon','member','Gold','Rusher'],['Echo','member','Silver','Support']];
    const members = names.map((n,i)=>({id:'m'+(i+1),ingame_name:n[0],discord_id:n[0].toLowerCase()+'#'+(1000+i*7),role:n[1],rank:n[2],playstyle:n[3],is_active:true,joined_at:new Date().toISOString()}));
    const periods = [{id:'p1',label:'Tháng 10/2026',amount:50000,due_date:'2026-10-31'}];
    const sts = ['paid','paid','pending','unpaid','paid','unpaid'];
    const payments = members.map((m,i)=>({id:'pay'+(i+1),member_id:m.id,period_id:'p1',status:sts[i],bill_image_url:null,submitted_at:null}));
    d = { members, periods, payments, settings:{clan_name:'ARENA CLAN',bank_name:'Vietcombank',bank_account:'0123456789',account_holder:'NGUYEN VAN A',momo_phone:'0900000000',qr_image_url:null} };
    demoSave(d);
  }
  return d;
}
const demoSave = d => localStorage.setItem(DKEY, JSON.stringify(d));
const uid = () => 'id' + Math.random().toString(36).slice(2, 10);

const api = DEMO ? {
  async me(){ const d = demoLoad(); return ({leader:d.members[0], captain:d.members[1], member:d.members[3], guest:null})[S.demoRole] || null; },
  async members(){ return demoLoad().members; },
  async saveMember(m){ const d = demoLoad(); if (m.id){ d.members = d.members.map(x => x.id === m.id ? {...x, ...m} : x); } else { m.id = uid(); m.joined_at = new Date().toISOString(); d.members.push(m); d.payments.push(...d.periods.map(p => ({id:uid(),member_id:m.id,period_id:p.id,status:'unpaid'}))); } demoSave(d); },
  async removeMember(id){ const d = demoLoad(); d.members = d.members.filter(x => x.id !== id); d.payments = d.payments.filter(p => p.member_id !== id); demoSave(d); },
  async periods(){ return demoLoad().periods.slice().reverse(); },
  async createPeriod(p){ const d = demoLoad(); p.id = uid(); d.periods.push(p); d.members.filter(m => m.is_active).forEach(m => d.payments.push({id:uid(),member_id:m.id,period_id:p.id,status:'unpaid'})); demoSave(d); return p.id; },
  async payments(pid){ const d = demoLoad(); return d.payments.filter(p => p.period_id === pid).map(p => ({...p, member: d.members.find(m => m.id === p.member_id) || {}})); },
  async setStatus(id, status){ const d = demoLoad(); d.payments = d.payments.map(p => p.id === id ? {...p, status} : p); demoSave(d); },
  async submitBill(pay, file){ const d = demoLoad(); const url = await fileToDataURL(file); d.payments = d.payments.map(p => p.id === pay.id ? {...p, status:'pending', bill_image_url:url, submitted_at:new Date().toISOString()} : p); demoSave(d); },
  async billUrl(path){ return path; },
  async settings(){ return demoLoad().settings; },
  async saveSettings(s, qrFile){ const d = demoLoad(); if (qrFile) s.qr_image_url = await fileToDataURL(qrFile); d.settings = {...d.settings, ...s}; demoSave(d); },
  resetDemo(){ localStorage.removeItem(DKEY); }
} : {
  async me(){ return must(await sb.from('members').select('*').eq('auth_user_id', S.user.id).maybeSingle()); },
  async members(){ return must(await sb.from('members').select('*').order('joined_at')); },
  async saveMember(m){ if (m.id){ const id = m.id; delete m.id; must(await sb.from('members').update(m).eq('id', id)); } else { delete m.id; const row = must(await sb.from('members').insert(m).select().single());
      // tạo dòng "chưa đóng" cho các kỳ đã có
      const per = must(await sb.from('fund_periods').select('id'));
      if (per.length) must(await sb.from('payments').insert(per.map(p => ({member_id:row.id, period_id:p.id}))));
  } },
  async removeMember(id){ must(await sb.from('members').delete().eq('id', id)); },
  async periods(){ return must(await sb.from('fund_periods').select('*').order('created_at', {ascending:false})); },
  async createPeriod(p){ delete p.id; const row = must(await sb.from('fund_periods').insert(p).select().single()); return row.id; },
  async payments(pid){ const rows = must(await sb.from('payments').select('*, members!payments_member_id_fkey(ingame_name,discord_id,role)').eq('period_id', pid)); return rows.map(r => ({...r, member:r.members || {}})).sort((a,b) => (a.member.ingame_name||'').localeCompare(b.member.ingame_name||'')); },
  async setStatus(id, status){ must(await sb.from('payments').update({status, reviewed_by:S.me.id, reviewed_at:new Date().toISOString()}).eq('id', id)); },
  async submitBill(pay, file){ const ext = (file.name.split('.').pop() || 'jpg').toLowerCase(); const path = `${S.me.id}/${pay.id}-${Date.now()}.${ext}`;
    const up = await sb.storage.from('bills').upload(path, file, {upsert:false}); if (up.error) throw up.error;
    must(await sb.from('payments').update({status:'pending', bill_image_url:path, submitted_at:new Date().toISOString()}).eq('id', pay.id)); },
  async billUrl(path){ const r = await sb.storage.from('bills').createSignedUrl(path, 600); if (r.error) throw r.error; return r.data.signedUrl; },
  async settings(){ return must(await sb.from('clan_settings').select('*').eq('id', 1).single()); },
  async saveSettings(s, qrFile){ if (qrFile){ const path = `qr-${Date.now()}.${(qrFile.name.split('.').pop()||'png').toLowerCase()}`; const up = await sb.storage.from('clan-assets').upload(path, qrFile); if (up.error) throw up.error; s.qr_image_url = sb.storage.from('clan-assets').getPublicUrl(path).data.publicUrl; }
    must(await sb.from('clan_settings').update(s).eq('id', 1)); }
};

/* ============================================================
   KHỞI ĐỘNG & ĐĂNG NHẬP
   ============================================================ */
async function boot(){
  if (!DEMO){ const { data } = await sb.auth.getSession(); S.user = data.session ? data.session.user : null; }
  await loadAll(); render();
}
if (!DEMO) sb.auth.onAuthStateChange((ev, session) => {
  const id = session && session.user ? session.user.id : null;
  if ((ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') && id !== (S.user ? S.user.id : null)) boot();
});

async function loadAll(){
  if (DEMO) S.user = { id:'demo-' + S.demoRole };
  S.me = S.user ? await api.me() : null;
  if (S.me){
    [S.members, S.periods, S.settings] = await Promise.all([api.members(), api.periods(), api.settings()]);
    if (!S.periods.find(p => p.id === S.periodId)) S.periodId = S.periods[0] ? S.periods[0].id : null;
    S.payments = S.periodId ? await api.payments(S.periodId) : [];
  } else { S.members = []; S.periods = []; S.payments = []; S.settings = {}; S.periodId = null; S.view = 'tour'; }
  await tourLoad();
}
async function refresh(){ try { await loadAll(); render(); } catch(e){ toast(e.message, true); } }

function renderLogin(){
  $('#app').innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="hud p-8 w-full max-w-md">
      <div class="mono text-xs" style="color:var(--orange)">// SECURE ACCESS</div>
      <h1 class="text-3xl font-bold tracking-widest mb-1" style="color:var(--sand)">CLAN HQ</h1>
      <p class="mb-6" style="color:var(--mut)">Đăng nhập hoặc đăng ký tài khoản. Người ngoài clan vẫn đăng ký giải đấu được.</p>
      <button class="btn pri w-full mb-4" onclick="loginDiscord()">Đăng nhập bằng Discord</button>
      <div class="mono text-xs text-center mb-4" style="color:var(--mut)">— HOẶC EMAIL —</div>
      <label class="lbl">Email</label><input id="lg-email" class="inp mb-3" type="email">
      <label class="lbl">Mật khẩu</label><input id="lg-pass" class="inp mb-4" type="password">
      <div class="flex gap-2"><button class="btn flex-1" onclick="loginEmail()">Đăng nhập</button><button class="btn flex-1" onclick="signupEmail()">Đăng ký</button></div>
      <button class="btn w-full mt-3" onclick="boot()">← Quay lại</button>
    </div>
  </div>`;
}
async function loginDiscord(){ const r = await sb.auth.signInWithOAuth({provider:'discord', options:{redirectTo:location.origin + location.pathname}}); if (r.error) toast(r.error.message, true); }
function creds(){ const email = $('#lg-email').value.trim(), password = $('#lg-pass').value; if (!email || !password){ toast('Hãy tự gõ email và mật khẩu (tối thiểu 6 ký tự).', true); return null; } return { email, password }; }
async function loginEmail(){ const c = creds(); if (!c) return; const r = await sb.auth.signInWithPassword(c); if (r.error) toast(r.error.message, true); }
async function signupEmail(){ const c = creds(); if (!c) return; const r = await sb.auth.signUp(c); if (r.error) toast(r.error.message, true); else toast('Đã đăng ký. Kiểm tra email xác nhận (nếu có bật) rồi đăng nhập.'); }
async function logout(){ await sb.auth.signOut(); }

function renderClaim(){
  $('#app').innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="hud p-8 w-full max-w-md">
      <div class="mono text-xs" style="color:var(--orange)">// CHƯA LIÊN KẾT HỒ SƠ</div>
      <h2 class="text-2xl font-bold mb-2" style="color:var(--sand)">Liên kết tài khoản</h2>
      <p class="mb-4" style="color:var(--mut)">Nhập đúng <b>tên in-game</b> mà Leader/Captain đã thêm cho bạn trong danh sách clan.</p>
      <input id="claim-name" class="inp mb-4" placeholder="Tên in-game">
      <div class="flex gap-2"><button class="btn pri flex-1" onclick="claim()">Liên kết</button><button class="btn flex-1" onclick="boot()">Quay lại</button></div>
    </div>
  </div>`;
}
async function claim(){
  const r = await sb.rpc('claim_member', {p_name:$('#claim-name').value.trim()});
  if (r.error) return toast(r.error.message, true);
  boot();
}

/* ============================================================
   GIAO DIỆN CHÍNH
   ============================================================ */
function render(){
  if (!S.me && S.view !== 'tour') S.view = 'tour';
  const clan = esc((S.me && S.settings.clan_name) || 'CLAN LAG');
  const tabs = S.me ? [['dash','Tổng quan'],['members','Thành viên'],['fund','Quỹ clan']] : [];
  tabs.push(['tour','Đăng ký giải']);
  if (isLeader()) tabs.push(['settings','Cài đặt']);
  $('#app').innerHTML = `
  <header class="border-b" style="border-color:var(--line);background:rgba(10,10,9,.85)">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
      <div>
        <div class="mono text-xs" style="color:var(--orange)">// TACTICAL COMMAND</div>
        <div class="text-2xl font-bold tracking-widest" style="color:var(--sand)">${clan}</div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="text-right">
          <div class="font-bold">${esc(S.me ? S.me.ingame_name : ((S.user && S.user.email) || 'Khách'))}</div>

/* ---------- Nút bấm có trạng thái "đang xử lý" + thông báo lỗi ---------- */
async function act(btn, fn, okMsg){
  if (btn && btn.disabled) return;
  const old = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Đang xử lý…'; btn.style.opacity = '.6'; }
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e){ console.error(e); toast(errMsg(e), true); }
  finally { if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = old; btn.style.opacity = ''; } }
}
function askText(title, label, opts){
  opts = opts || {};
  return new Promise(res => {
    askResolve = res;
    openModal(`<h3 class="text-lg font-bold mb-3" style="color:var(--sand)">${esc(title)}</h3>
      <label class="lbl">${esc(label)}</label>
      <textarea id="ask-t" class="inp mb-4" rows="4" maxlength="${opts.max || 500}"></textarea>
      <div class="flex gap-2"><button class="btn pri flex-1" onclick="askOk(${opts.required === false ? 'false' : 'true'})">${esc(opts.ok || 'Gửi')}</button><button class="btn flex-1" onclick="closeModal()">Hủy</button></div>`);
    setTimeout(() => { const el = $('#ask-t'); if (el) el.focus(); }, 30);
  });
}
function askOk(required){
  const v = $('#ask-t').value.trim();
  if (required && !v) return toast('Cần nhập nội dung.', true);
  const f = askResolve; askResolve = null; $('#modal').innerHTML = ''; if (f) f(v);
}
async function copyText(el){
  const txt = el.dataset.copy;
  try { await navigator.clipboard.writeText(txt); toast('Đã sao chép'); }
  catch (e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Đã sao chép'); } catch (_){ toast('Không sao chép được, hãy chép tay.', true); } ta.remove(); }
}
function shrinkImage(file, max){
  max = max || 900;
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .7)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh.')); };
    img.src = url;
  });
}
function checkImage(f){
  if (!f) throw new Error('Hãy chọn một ảnh.');
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) throw new Error('Chỉ nhận ảnh JPG, PNG hoặc WEBP.');
  if (f.size > 5 * 1024 * 1024) throw new Error('Ảnh tối đa 5MB.');
}

function windowState(t){
  const now = Date.now();
  if (t.status !== 'open') return { open:false, reason: ['ongoing','finished'].includes(t.status) ? 'Giải đã bắt đầu hoặc đã kết thúc.' : 'Ban tổ chức đã đóng đăng ký.' };
  if (t.reg_open_at && now < Date.parse(t.reg_open_at)) return { open:false, reason:'Chưa đến thời gian mở đăng ký.' };
  if (t.reg_close_at && now > Date.parse(t.reg_close_at)) return { open:false, reason:'Đã hết thời gian đăng ký.' };
  return { open:true };
}
function regState(t){
  if (!t) return { open:false, reason:'Chưa có giải đấu.' };
  const w = windowState(t); if (!w.open) return w;
  if (TS.stats.registered >= t.max_teams) return { open:false, reason:'Giải đã đủ số đội tối đa.' };
  return w;
}
function tStatus(t){
  if (t.status === 'finished') return ['ĐÃ KẾT THÚC', 'mut'];
  if (t.status === 'ongoing') return ['ĐANG THI ĐẤU', 'info'];
  if (t.status === 'draft') return ['NHÁP · CHƯA CÔNG KHAI', 'mut'];
  if (regState(t).open) return ['ĐANG MỞ ĐĂNG KÝ', 'ok'];
  if (t.status === 'open' && t.reg_open_at && Date.now() < Date.parse(t.reg_open_at)) return ['SẮP MỞ ĐĂNG KÝ', 'warn'];
  if (t.status === 'open' && TS.stats.registered >= t.max_teams) return ['ĐÃ ĐỦ ĐỘI', 'warn'];
  return ['ĐÃ ĐÓNG ĐĂNG KÝ', 'bad'];
}
const grp = f => f === 'mode' ? 'mode' : f === 'terms' ? 'confirm' : (f === 'members' || /^m\d+_/.test(f)) ? 'members' : 'info';
function validateReg(d, t, level){
  const e = [], M = MODES[d.mode], add = (f, m) => e.push({ f, m });
  const L = (s, a, b) => { s = (s || '').trim(); return s.length >= a && s.length <= b; };
  if (!M){ add('mode', 'Hãy chọn thể thức Solo, Duo hoặc Squad.'); return e; }
  const full = level === 'full', ms = d.members || [];
  if (full ? !L(d.team_name, 3, 30) : (d.team_name || '').trim().length > 30) add('team_name', 'Tên đội cần từ 3 đến 30 ký tự.');
  if (full ? !L(d.captain_name, 2, 60) : (d.captain_name || '').trim().length > 60) add('captain_name', 'Nhập tên đội trưởng (2–60 ký tự).');
  if (full ? !L(d.captain_ingame, 2, 30) : (d.captain_ingame || '').trim().length > 30) add('captain_ingame', 'Tên trong game 2–30 ký tự.');
  const cu = (d.captain_uid || '').trim();
  if (full ? !UID_RE.test(cu) : (cu && !UID_RE.test(cu))) add('captain_uid', 'UID chỉ gồm 5–15 chữ số.');
  if (full ? !L(d.contact, 3, 60) : (d.contact || '').trim().length > 60) add('contact', 'Nhập Discord hoặc Zalo liên hệ (3–60 ký tự).');
  if ((d.substitute || '').trim().length > 60) add('substitute', 'Tối đa 60 ký tự.');
  if (ms.length > M.max - 1) add('members', 'Thể thức ' + M.label + ' tối đa ' + M.max + ' người chơi.');
  if (full && ms.length < M.min - 1) add('members', 'Thể thức ' + M.label + ' cần tối thiểu ' + M.min + ' người chơi (kể cả đội trưởng).');
  ms.forEach((m, i) => {
    const u = (m.uid || '').trim();
    if (full ? !L(m.ingame, 2, 30) : (m.ingame || '').trim().length > 30) add('m' + i + '_ingame', 'Tên trong game 2–30 ký tự.');
    if (full ? !UID_RE.test(u) : (u && !UID_RE.test(u))) add('m' + i + '_uid', 'UID chỉ gồm 5–15 chữ số.');
  });
  const uids = [cu, ...ms.map(m => (m.uid || '').trim())].filter(Boolean);
  if (new Set(uids).size !== uids.length) add('members', 'Có UID bị trùng trong cùng một đội.');
  if (full && !d.terms_accepted) add('terms', 'Bạn cần xác nhận đã đọc và đồng ý điều lệ giải đấu.');
  return e;
}

    if (file){ checkImage(file); const ext = ({ 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp' })[file.type]; path = `${S.user.id}/${id}-${Date.now()}.${ext}`;
      const up = await sb.storage.from('payment-proofs').upload(path, file, { upsert:false, contentType:file.type }); if (up.error) throw up.error; }
    return await rpc('mark_transferred', { p_id:id, p_path:path });
  },
  async cancel(id){ return await rpc('cancel_registration', { p_id:id }); },
  async messages(rid){ return must(await sb.from('registration_messages').select('*').eq('registration_id', rid).order('created_at')); },
  async postMessage(rid, body){ await rpc('post_message', { p_id:rid, p_body:body }); },
  async proofUrl(path){ const r = await sb.storage.from('payment-proofs').createSignedUrl(path, 600); if (r.error) throw r.error; return r.data.signedUrl; },
  async staffRegs(tid){ return must(await sb.from('registrations').select('*').eq('tournament_id', tid).neq('review_status', 'draft').order('submitted_at', { ascending:false })); },
  async staffReview(id, status, note){ await rpc('staff_review', { p_id:id, p_status:status, p_note:note || '' }); },
  async staffPayment(id, status, note){ await rpc('staff_payment', { p_id:id, p_status:status, p_note:note || '' }); },
  async staffPoints(id, n){ await rpc('staff_points', { p_id:id, p_points:n }); },
  async logs(tid, rid){ let q = sb.from('tournament_logs').select('*').eq('tournament_id', tid).order('created_at', { ascending:false }).limit(200); if (rid) q = q.eq('registration_id', rid); return must(await q); },
  async uploadAsset(file){ checkImage(file); const path = `tournament/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${(file.name.split('.').pop() || 'jpg').toLowerCase()}`;
    const up = await sb.storage.from('clan-assets').upload(path, file); if (up.error) throw up.error; return sb.storage.from('clan-assets').getPublicUrl(path).data.publicUrl; },
  async saveTournament(obj){ if (obj.id){ const id = obj.id; delete obj.id; must(await sb.from('tournaments').update(obj).eq('id', id)); } else { delete obj.id; must(await sb.from('tournaments').insert(obj)); } }
};

async function tourLoad(){
  try {
    TS.list = await tapi.list();
    if (!TS.list.find(t => t.id === TS.tid)) TS.tid = (TS.list.find(t => t.status === 'open') || TS.list[0] || {}).id || null;
    if (TS.tid) [TS.stats, TS.teams] = await Promise.all([tapi.stats(TS.tid), tapi.teams(TS.tid)]); else { TS.stats = { registered:0, approved:0 }; TS.teams = []; }
    TS.myRegs = S.user ? await tapi.myRegs() : [];
    TS.error = null;
  } catch (e){ console.error(e); TS.error = errMsg(e); }
}
async function staffLoad(){
  const t = curT(); if (!t || !isAdmin()) return;
  try { [TS.staff.regs, TS.staff.logs] = await Promise.all([tapi.staffRegs(t.id), tapi.logs(t.id)]); } catch (e){ toast(errMsg(e), true); }
}

async function tourGo(sub){

}
async function tourSwitch(id){ TS.tid = id; TS.reg = null; TS.done = null; TS.detailId = null; await tourLoad(); if (TS.sub === 'staff') await staffLoad(); render(); }
function goSection(id){

const blankReg = tid => ({ id:null, tournament_id:tid, mode:null, team_name:'', captain_name:'', captain_ingame:'', captain_uid:'', contact:'', members:[], substitute:'', terms_accepted:false });
const regFromRow = r => ({ id:r.id, tournament_id:r.tournament_id, mode:r.mode, team_name:r.team_name || '', captain_name:r.captain_name || '', captain_ingame:r.captain_ingame || '', captain_uid:r.captain_uid || '', contact:r.contact || '', members:(r.members || []).map(m => ({ ingame:m.ingame || '', uid:m.uid || '' })), substitute:r.substitute || '', terms_accepted:false });
const stepsFor = mode => !mode ? ['mode'] : mode === 'solo' ? ['mode', 'info', 'confirm'] : ['mode', 'info', 'members', 'confirm'];
const regPayload = () => cleanReg(TS.reg);

function subRegister(t){
  if (!S.user) return needLogin('Đăng nhập để đăng ký tham gia giải đấu.');
  if (TS.done) return successHTML(t);
  const mine = TS.myRegs.find(r => r.tournament_id === t.id && !DEAD.includes(r.review_status));
  if (mine && mine.review_status !== 'draft' && !(TS.reg && TS.reg.id === mine.id)) return alreadyHTML(mine);
  if (!TS.reg){
    const rs = regState(t);
    if (!rs.open) return `<div class="hud p-6 text-center max-w-xl mx-auto"><div class="text-xl font-bold mb-2" style="color:var(--bad)">Không thể đăng ký lúc này</div><div style="color:var(--mut)">${esc(rs.reason)}</div></div>`;
    if (mine && mine.review_status === 'draft'){ TS.reg = regFromRow(mine); TS.step = TS.reg.mode ? 2 : 1; }
    else { TS.reg = blankReg(t.id); TS.step = 1; }
  }
  return wizardHTML(t);
}

        <div class="col-span-8 sm:col-span-5"><label class="lbl">UID</label><input id="r-m${i}_uid" class="inp ${TS.errs['m' + i + '_uid'] ? 'err' : ''}" value="${esc(m.uid)}" oninput="regMember(${i},'uid',this.value)">${TS.errs['m' + i + '_uid'] ? `<div class="ferr" id="e-m${i}_uid">${esc(TS.errs['m' + i + '_uid'])}</div>` : ''}</div>
        <div class="col-span-4 sm:col-span-2 pt-5"><button class="btn bad sm" ${R.members.length <= M.min - 1 ? 'disabled style="opacity:.4"' : ''} onclick="regDelMember(${i})">Xóa</button></div></div>`).join('');
    body = `<div class="mb-3" style="color:var(--mut)">Thể thức <b>${M.label}</b>: ${M.desc}, đội trưởng đã tính là người thứ nhất. Cần thêm tối thiểu ${M.min - 1}, tối đa ${M.max - 1} thành viên.</div>${rows}

      ${TS.errs.terms ? `<div class="ferr" id="e-terms">${esc(TS.errs.terms)}</div>` : ''}`;
  }
  const last = !!R.mode && TS.step === steps.length;
  return `<div class="hud p-5 max-w-3xl mx-auto">
    <div class="flex flex-wrap gap-2 mb-4">${steps.map((s, i) => `<div class="stp ${i + 1 === TS.step ? 'on' : ''} ${i + 1 < TS.step ? 'done' : ''}">${i + 1}. ${STEP_T[s]}</div>`).join('')}</div>
    <h2 class="text-xl font-bold mb-3" style="color:var(--sand)">${STEP_T[name]}${R.id ? ' <span class="badge mut">ĐANG SỬA HỒ SƠ</span>' : ''}</h2>
    ${body}
    <div class="flex flex-wrap gap-2 mt-6 pt-4" style="border-top:1px solid var(--line)">
      ${TS.step > 1 ? `<button class="btn" onclick="regBack()">Quay lại</button>` : ''}
      ${R.mode ? `<button class="btn" onclick="act(this, regSaveDraft)">Lưu bản nháp</button><button class="btn" onclick="regCheck()">Kiểm tra thông tin</button>` : ''}

}
function pickMode(k){
  const R = TS.reg, M = MODES[k]; R.mode = k;
  while (R.members.length < M.min - 1) R.members.push({ ingame:'', uid:'' });
  while (R.members.length > M.max - 1) R.members.pop();
  if (k === 'solo') R.substitute = '';
  TS.errs = {}; render();
}
function dropErr(k){ if (TS.errs[k]){ delete TS.errs[k]; const e = document.getElementById('e-' + k); if (e) e.remove(); const i = document.getElementById('r-' + k); if (i) i.classList.remove('err'); } }
function regSet(k, v){ TS.reg[k] = v; dropErr(k); }
function regMember(i, k, v){ TS.reg.members[i][k] = v; dropErr('m' + i + '_' + k); dropErr('members'); }
function regAddMember(){ const M = MODES[TS.reg.mode]; if (TS.reg.members.length >= M.max - 1) return toast('Đã đủ số thành viên tối đa của thể thức ' + M.label + '.', true); TS.reg.members.push({ ingame:'', uid:'' }); render(); }
function regDelMember(i){ const M = MODES[TS.reg.mode]; if (TS.reg.members.length <= M.min - 1) return toast('Thể thức ' + M.label + ' cần tối thiểu ' + M.min + ' người chơi.', true); TS.reg.members.splice(i, 1); TS.errs = {}; render(); }
function regTerms(v){ TS.reg.terms_accepted = v; dropErr('terms'); }
function showRules(){ const t = curT(); openModal(`<h3 class="text-lg font-bold mb-3" style="color:var(--sand)">Điều lệ giải đấu</h3><div class="whitespace-pre-line mb-4 text-sm">${esc(t.rules || 'Ban tổ chức chưa cập nhật điều lệ.')}</div><button class="btn w-full" onclick="closeModal()">Đóng</button>`, true); }
function setErrs(errs, jump){
  TS.errs = {}; errs.forEach(e => { if (!TS.errs[e.f]) TS.errs[e.f] = e.m; });
  if (jump && errs.length){ const idx = stepsFor(TS.reg.mode).indexOf(grp(errs[0].f)); if (idx >= 0) TS.step = idx + 1; }
  render();
}
function regBack(){ TS.step = Math.max(1, TS.step - 1); TS.errs = {}; render(); }
function regNext(){
  const t = curT(), R = TS.reg, steps = stepsFor(R.mode), name = steps[TS.step - 1];
  const errs = validateReg(R, t, 'full').filter(e => grp(e.f) === name);
  if (errs.length){ setErrs(errs); return toast('Vui lòng kiểm tra lại các mục được đánh dấu đỏ.', true); }

}
function regCheck(){
  const errs = validateReg(TS.reg, curT(), 'full');
  if (!errs.length){ TS.errs = {}; render(); return toast('Thông tin hợp lệ ✓ Bạn có thể gửi đăng ký.'); }

}
async function regSaveDraft(){

async function regSubmit(){

  if (!confirm('Gửi đăng ký đội "' + TS.reg.team_name.trim() + '"?\nSau khi gửi, bạn chỉ sửa được khi ban tổ chức yêu cầu bổ sung.')) return;

function qrFor(t, r){

/* ---------- Quản lý giải (ban tổ chức) ---------- */
function sMatch(r){

  else if (f !== 'all' && r.review_status !== f) return false;
  if (q){ const hay = [r.code, r.team_name, r.captain_name, r.captain_ingame, r.captain_uid, r.contact, ...(r.members || []).flatMap(m => [m.ingame, m.uid])].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
  return true;
}
function sTableHTML(){
  const rows = TS.staff.regs.filter(sMatch);
  if (!rows.length) return `<tr><td colspan="7" style="color:var(--mut)">Không có hồ sơ phù hợp.</td></tr>`;
  return rows.map(r => `<tr><td class="mono">${esc(r.code || '')}</td><td><b>${esc(r.team_name)}</b></td><td>${MODES[r.mode] ? MODES[r.mode].label : esc(r.mode)}</td><td>${tb(REV, r.review_status)}</td><td>${tb(PAY, r.payment_status)}</td><td class="mono text-sm" style="color:var(--mut)">${fmtDT(r.submitted_at)}</td><td><button class="btn sm" onclick="staffDetail('${r.id}')">Chi tiết</button></td></tr>`).join('');

function toggleLogs(){ TS.staff.showLogs = !TS.staff.showLogs; render(); }

      <button class="btn sm" onclick="exportCsv()">Xuất CSV</button>
      <button class="btn sm" onclick="toggleLogs()">${TS.staff.showLogs ? 'Ẩn' : 'Xem'} lịch sử thao tác</button>
    </div></div>
    ${leader ? '' : `<div class="text-xs mt-2" style="color:var(--mut)">Captain: duyệt hồ sơ, xác nhận lệ phí, nhắn người chơi. Mở/khóa đăng ký và sửa thông tin giải do Leader thực hiện.</div>`}
  </div>
  <div class="hud p-5">
    <div class="flex flex-wrap gap-2 mb-3">
      <select class="inp" style="max-width:240px" onchange="sFilter(this.value)">${[['all', 'Tất cả hồ sơ'], ['pending', 'Chờ duyệt'], ['need_info', 'Cần bổ sung'], ['proof', 'Chờ xác nhận thanh toán'], ['approved', 'Đã duyệt'], ['confirmed', 'Đã xác nhận tham gia'], ['rejected', 'Bị từ chối'], ['cancelled', 'Đã hủy']].map(o => `<option value="${o[0]}" ${TS.staff.filter === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
      <input class="inp" style="max-width:300px" placeholder="Tìm mã, tên đội, UID, liên hệ…" value="${esc(TS.staff.q)}" oninput="sSearch(this.value)"></div>
    <div class="scroll-x"><table><thead><tr><th>Mã</th><th>Đội</th><th>Thể thức</th><th>Hồ sơ</th><th>Thanh toán</th><th>Gửi lúc</th><th></th></tr></thead><tbody id="s-table">${sTableHTML()}</tbody></table></div>
  </div>
  ${TS.staff.showLogs ? `<div class="hud p-5 mt-4"><h3 class="font-bold mb-2" style="color:var(--sand)">Lịch sử thao tác (200 gần nhất)</h3>${logsHTML(TS.staff.logs, true)}</div>` : ''}`;
}
function logsHTML(logs, showReg){
  if (!logs.length) return `<div class="text-sm" style="color:var(--mut)">Chưa có thao tác nào.</div>`;
  return `<div class="scroll-x" style="max-height:320px;overflow:auto"><table><tbody>${logs.map(l => `<tr><td class="mono text-xs" style="color:var(--mut);white-space:nowrap">${fmtDT(l.created_at)}</td><td>${esc(l.actor_name || 'Hệ thống')}</td><td class="mono text-xs">${esc(l.action)}</td><td class="text-sm">${esc(l.detail || '')}${showReg && l.registration_id ? ' <span class="mono text-xs" style="color:var(--mut)">(' + esc((TS.staff.regs.find(r => r.id === l.registration_id) || {}).code || '') + ')</span>' : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
async function staffDetail(id){
  const r = TS.staff.regs.find(x => x.id === id); if (!r) return;
  openModal('<div class="mono">Đang tải hồ sơ…</div>', true);
  try { const [msgs, logs] = await Promise.all([tapi.messages(id), tapi.logs(r.tournament_id, id)]); openModal(staffDetailHTML(r, msgs, logs), true); }
  catch (e){ closeModal(); toast(errMsg(e), true); }
}
function staffDetailHTML(r, msgs, logs){
  const t = TS.list.find(x => x.id === r.tournament_id) || {}, fee = feeOf(t, r.mode), dead = DEAD.includes(r.review_status);
  const row = (l, v) => `<tr><td class="mono" style="color:var(--mut);width:38%">${l}</td><td><b>${esc(v || '—')}</b></td></tr>`;
  const B = (label, cls, js, show) => show ? `<button class="btn sm ${cls}" onclick="act(this, () => ${js})">${label}</button>` : '';
  const canConfirm = r.review_status === 'approved' && (r.payment_status === 'paid' || fee === 0);
  return `<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><div class="text-xl font-bold" style="color:var(--sand)">${esc(r.team_name)}</div><div class="mono" style="color:var(--orange)">${esc(r.code || '')}</div></div><div class="flex gap-1 flex-wrap">${tb(REV, r.review_status)} ${tb(PAY, r.payment_status)}</div></div>
    <div class="grid md:grid-cols-2 gap-4">
      <div><table><tbody>${row('Thể thức', (MODES[r.mode] || {}).label)}${row('Lệ phí', money(fee))}${row('Đội trưởng', r.captain_name)}${row('Tên trong game', r.captain_ingame)}${row('UID', r.captain_uid)}${row('Liên hệ', r.contact)}${(r.members || []).map((m, i) => row('Thành viên ' + (i + 2), m.ingame + ' · UID ' + m.uid)).join('')}${r.substitute ? row('Dự bị', r.substitute) : ''}${row('Gửi lúc', fmtDT(r.submitted_at))}${row('Báo chuyển khoản', fmtDT(r.proof_at))}${row('Xác nhận phí lúc', fmtDT(r.paid_at))}</tbody></table>
        <div class="mt-3 flex flex-wrap gap-2 items-center">${r.proof_path ? `<button class="btn sm" onclick="sProof('${r.id}')">Xem minh chứng</button>` : '<span class="text-sm" style="color:var(--mut)">Chưa có ảnh minh chứng</span>'}</div>
        <div class="mt-3 flex items-center gap-2"><label class="lbl" style="margin:0">Điểm</label><input id="s-points" type="number" min="0" class="inp" style="max-width:110px" value="${r.points}"><button class="btn sm" onclick="act(this, () => sPoints('${r.id}'))">Lưu điểm</button></div>
      </div>
      <div><h3 class="font-bold mb-2" style="color:var(--sand)">Hồ sơ</h3>
        <div class="flex flex-wrap gap-2 mb-4">
          ${B('✓ Duyệt', 'ok', `sReview('${r.id}','approved')`, !dead && ['pending', 'need_info'].includes(r.review_status))}
          ${B('Yêu cầu chỉnh sửa', '', `sReview('${r.id}','need_info')`, !dead && ['pending', 'approved'].includes(r.review_status))}
          ${B('Từ chối', 'bad', `sReview('${r.id}','rejected')`, !dead)}
          ${B('Xác nhận tham gia', 'ok', `sReview('${r.id}','confirmed')`, canConfirm)}
        </div>
        <h3 class="font-bold mb-2" style="color:var(--sand)">Thanh toán (${money(fee)})</h3>
        <div class="flex flex-wrap gap-2 mb-4">
          ${B('✓ Xác nhận đã nhận lệ phí', 'ok', `sPay('${r.id}','paid')`, r.payment_status !== 'paid' && fee > 0)}
          ${B('Yêu cầu bổ sung minh chứng', '', `sPay('${r.id}','unpaid')`, r.payment_status !== 'unpaid')}
        </div>
        <h3 class="font-bold mb-2" style="color:var(--sand)">Tin nhắn</h3>
        <div class="mb-2" style="max-height:180px;overflow:auto">${msgsHTML(msgs)}</div>
        <button class="btn sm" onclick="act(this, () => sMsg('${r.id}'))">Nhắn người chơi</button>
      </div></div>
    <h3 class="font-bold mt-4 mb-2" style="color:var(--sand)">Lịch sử hồ sơ</h3>${logsHTML(logs, false)}
    <button class="btn w-full mt-4" onclick="closeModal()">Đóng</button>`;
}
const REVIEW_ASK = { need_info:['Yêu cầu chỉnh sửa hồ sơ', 'Nội dung cần người chơi sửa hoặc bổ sung'], rejected:['Từ chối hồ sơ', 'Lý do từ chối (người chơi sẽ thấy)'] };
async function sReview(id, status){
  let note = '';
  if (REVIEW_ASK[status]){ note = await askText(REVIEW_ASK[status][0], REVIEW_ASK[status][1], { ok:'Xác nhận' }); if (note === null) return; }
  else if (!confirm(status === 'approved' ? 'Duyệt hồ sơ này?' : 'Xác nhận đội này tham gia giải?')) return;
  await tapi.staffReview(id, status, note); toast('Đã cập nhật hồ sơ'); await staffReload(id);
}
async function sPay(id, status){
  let note = '';
  if (status === 'paid'){ if (!confirm('Xác nhận ĐÃ NHẬN ĐỦ lệ phí cho hồ sơ này?\nHãy đối chiếu giao dịch thực tế trong tài khoản ngân hàng trước khi xác nhận.')) return; }
  else { note = await askText('Yêu cầu bổ sung minh chứng', 'Nội dung gửi người chơi', { ok:'Gửi yêu cầu' }); if (note === null) return; }
  await tapi.staffPayment(id, status, note); toast('Đã cập nhật thanh toán'); await staffReload(id);
}
async function sMsg(id){
  const body = await askText('Nhắn người chơi', 'Nội dung', { max:1000 }); if (body === null) return;
  await tapi.postMessage(id, body); toast('Đã gửi tin nhắn'); await staffReload(id);
}
async function sPoints(id){
  const n = parseInt($('#s-points').value, 10); await tapi.staffPoints(id, n); toast('Đã lưu điểm'); await staffReload(id);
}
async function sProof(id){
  const r = TS.staff.regs.find(x => x.id === id);
  try { const url = await tapi.proofUrl(r.proof_path); openModal(`<h3 class="font-bold mb-2" style="color:var(--sand)">Minh chứng · ${esc(r.team_name)}</h3><img src="${esc(url)}" alt="minh chứng" class="w-full mb-3"><button class="btn w-full" onclick="staffDetail('${id}')">← Quay lại hồ sơ</button>`, true); }
  catch (e){ toast(errMsg(e), true); }
}
async function setTStatus(id, status){
  if (!confirm(status === 'open' ? 'Mở đăng ký cho giải này?' : 'Khóa đăng ký? Người chơi sẽ không đăng ký mới được nữa.')) return;
  await tapi.saveTournament({ id, status }); toast(status === 'open' ? 'Đã mở đăng ký' : 'Đã khóa đăng ký'); await staffReload();
}
function exportCsv(){
  const t = curT(), R = TS.staff.regs; if (!R.length) return toast('Chưa có hồ sơ để xuất.', true);
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const head = ['Mã', 'Đội', 'Thể thức', 'Trạng thái hồ sơ', 'Thanh toán', 'Đội trưởng', 'Tên trong game', 'UID', 'Liên hệ', 'Thành viên', 'Dự bị', 'Điểm', 'Gửi lúc', 'Xác nhận phí lúc'];
  const lines = [head, ...R.map(r => [r.code, r.team_name, (MODES[r.mode] || {}).label, (REV[r.review_status] || [''])[0], (PAY[r.payment_status] || [''])[0], r.captain_name, r.captain_ingame, r.captain_uid, r.contact, (r.members || []).map(m => m.ingame + ':' + m.uid).join('; '), r.substitute, r.points, r.submitted_at, r.paid_at])].map(a => a.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines], { type:'text/csv;charset=utf-8' })); a.download = `${t.slug}-danh-sach-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Đã xuất ' + R.length + ' hồ sơ.');
}

/* ---------- Form tạo / sửa giải (Leader) ---------- */
function tourForm(id){
  const t = id ? TS.list.find(x => x.id === id) : null, v = k => esc(t ? (t[k] ?? '') : ''), sel = t ? t.status : 'draft';
  const inp = (k, label, type, extra) => `<div class="mb-3"><label class="lbl">${label}</label><input id="tf-${k}" type="${type || 'text'}" class="inp" value="${v(k)}" ${extra || ''}></div>`;
  const dt = (k, label) => `<div class="mb-3"><label class="lbl">${label}</label><input id="tf-${k}" type="datetime-local" class="inp" value="${toLocalInput(t && t[k])}"></div>`;
  const ta = (k, label, rows) => `<div class="mb-3"><label class="lbl">${label}</label><textarea id="tf-${k}" rows="${rows || 4}" class="inp">${v(k)}</textarea></div>`;
  openModal(`<h3 class="text-lg font-bold mb-4" style="color:var(--sand)">${t ? 'Sửa thông tin giải' : 'Tạo giải đấu mới'}</h3>
    <div class="grid md:grid-cols-2 gap-x-4">
      ${inp('name', 'Tên giải')}${t ? '' : inp('slug', 'Slug (a-z, 0-9, dấu gạch ngang)', 'text', 'placeholder="lag-open-s2"')}
      <div class="mb-3 md:col-span-2"><label class="lbl">Phụ đề</label><input id="tf-subtitle" class="inp" value="${v('subtitle')}"></div>
      <div class="mb-3"><label class="lbl">Trạng thái</label><select id="tf-status" class="inp">${[['draft', 'Nháp (chưa công khai)'], ['open', 'Mở đăng ký'], ['closed', 'Đóng đăng ký'], ['ongoing', 'Đang thi đấu'], ['finished', 'Đã kết thúc']].map(o => `<option value="${o[0]}" ${sel === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
      ${inp('max_teams', 'Số đội tối đa', 'number', 'min="1"')}${dt('reg_open_at', 'Mở đăng ký lúc')}${dt('reg_close_at', 'Đóng đăng ký lúc')}${dt('start_at', 'Bắt đầu thi đấu')}${inp('prize_total', 'Tổng giải thưởng (chữ)')}
      ${inp('fee_solo', 'Lệ phí Solo (đ)', 'number', 'min="0"')}${inp('fee_duo', 'Lệ phí Duo (đ)', 'number', 'min="0"')}${inp('fee_squad', 'Lệ phí Squad (đ)', 'number', 'min="0"')}
      <label class="flex items-center gap-2 mb-3 pt-5"><input type="checkbox" id="tf-allow_substitute" ${!t || t.allow_substitute ? 'checked' : ''}> Cho phép thành viên dự bị</label>
    </div>
    <h4 class="font-bold mt-2 mb-2" style="color:var(--sand)">Thanh toán</h4>
    <div class="grid md:grid-cols-2 gap-x-4">${inp('bank_name', 'Ngân hàng')}${inp('bank_account', 'Số tài khoản')}${inp('account_holder', 'Tên người nhận')}${inp('bank_bin', 'Mã ngân hàng VietQR (tùy chọn, VD: VCB)', 'text', 'placeholder="Điền để QR tự có số tiền + nội dung"')}</div>
    <div class="mb-3"><label class="lbl">Ảnh QR tĩnh (dùng khi không điền mã ngân hàng)</label>${t && t.qr_image_url ? `<img src="${esc(t.qr_image_url)}" class="w-24 bg-white p-1 mb-2" alt="">` : ''}<input type="file" id="tf-qr" accept="image/*" class="inp"></div>
    <div class="mb-3"><label class="lbl">Ảnh banner (để trống = ảnh mặc định)</label><input type="file" id="tf-banner" accept="image/*" class="inp"></div>
    <h4 class="font-bold mt-2 mb-2" style="color:var(--sand)">Nội dung hiển thị</h4>
    ${ta('rules', 'Điều lệ giải đấu', 6)}${ta('format_text', 'Thể thức thi đấu')}${ta('prize_structure', 'Cơ cấu giải thưởng')}${ta('schedule', 'Lịch thi đấu dự kiến')}${ta('member_rules', 'Quy định về thành viên')}${ta('refund_policy', 'Chính sách hủy và hoàn phí')}
    <div class="mb-3"><label class="lbl">Câu hỏi thường gặp (mỗi cặp cách nhau 1 dòng trống: dòng đầu là câu hỏi, các dòng sau là trả lời)</label><textarea id="tf-faq" rows="6" class="inp">${esc(faqToText(t && t.faq))}</textarea></div>
    ${ta('contact', 'Thông tin liên hệ ban tổ chức', 3)}
    <div class="flex gap-2 mt-2"><button class="btn pri flex-1" onclick="act(this, () => saveTour('${id || ''}'))">Lưu</button><button class="btn flex-1" onclick="closeModal()">Hủy</button></div>`, true);
}
async function saveTour(id){
  const g = k => $('#tf-' + k).value.trim(), n = k => { const x = parseInt($('#tf-' + k).value, 10); return Number.isFinite(x) ? x : NaN; };
  const o = { name:g('name'), subtitle:g('subtitle') || null, status:g('status'), max_teams:n('max_teams'), prize_total:g('prize_total') || null,
    fee_solo:n('fee_solo'), fee_duo:n('fee_duo'), fee_squad:n('fee_squad'), allow_substitute:$('#tf-allow_substitute').checked,
    reg_open_at:fromLocalInput($('#tf-reg_open_at').value), reg_close_at:fromLocalInput($('#tf-reg_close_at').value), start_at:fromLocalInput($('#tf-start_at').value),
    bank_name:g('bank_name') || null, bank_account:g('bank_account') || null, account_holder:g('account_holder') || null, bank_bin:g('bank_bin') || null,
    rules:g('rules') || null, format_text:g('format_text') || null, prize_structure:g('prize_structure') || null, schedule:g('schedule') || null,
    member_rules:g('member_rules') || null, refund_policy:g('refund_policy') || null, faq:textToFaq($('#tf-faq').value), contact:g('contact') || null };
  if (o.name.length < 3) throw new Error('Tên giải cần từ 3 ký tự.');
  if (!(o.max_teams >= 1)) throw new Error('Số đội tối đa phải từ 1 trở lên.');
  if (![o.fee_solo, o.fee_duo, o.fee_squad].every(x => x >= 0)) throw new Error('Lệ phí phải là số không âm.');
  if (o.reg_open_at && o.reg_close_at && Date.parse(o.reg_open_at) >= Date.parse(o.reg_close_at)) throw new Error('Thời gian đóng đăng ký phải sau thời gian mở.');
  if (id) o.id = id; else { o.slug = g('slug'); if (!/^[a-z0-9-]{3,40}$/.test(o.slug)) throw new Error('Slug chỉ gồm a-z, 0-9, dấu gạch ngang (3–40 ký tự).'); }
  const qr = $('#tf-qr').files[0], bn = $('#tf-banner').files[0];
  if (qr){ if (!DEMO) checkImage(qr); o.qr_image_url = await tapi.uploadAsset(qr); }
  if (bn){ if (!DEMO) checkImage(bn); o.banner_url = await tapi.uploadAsset(bn); }
  await tapi.saveTournament(o); closeModal(); toast('Đã lưu thông tin giải'); await tourLoad(); if (TS.sub === 'staff') await staffLoad(); render();
}

function authButtons(){
  if (!S.user) return `<button class="btn sm pri" onclick="renderLogin()">Đăng nhập / Đăng ký</button>`;
  return (S.me ? '' : `<button class="btn sm" onclick="renderClaim()">Liên kết thành viên clan</button>`) + `<button class="btn sm" onclick="logout()">Đăng xuất</button>`;
}

boot().catch(e => { console.error(e); $('#app').innerHTML = `<div class="p-8" style="color:var(--bad)">Lỗi khởi động: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
